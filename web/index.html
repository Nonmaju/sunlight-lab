<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>일조·일조권 사선 검토기</title>
  <script>try { if (localStorage.getItem('sunlight-theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    },
    "integrity": {
      "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js": "sha384-m8JoFX52V6NGv2usipnlLJKnJfL7IE8dbniPDDCSGSQv3Hm4n6PjfV6syVwfuoRc",
      "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.core.js": "sha384-mdKeCwPEcbDvzaxwhm+MVuLoMou+E7jQqrs4tmu/n8HBYPGI1kZt0MkJxlMR4zFM",
      "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/controls/OrbitControls.js": "sha384-LSqANrugPGTgf0eYsQTloqKWy926dOOXo2iZ9y6wLMIDEQoU9AaCLJF1Vcc7oJXr"
    }
  }
  </script>
</head>
<body>
  <header>
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="5" fill="var(--accent)"></circle><g stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"><path d="M13 2v3.2M13 20.8V24M2 13h3.2M20.8 13H24M5.2 5.2l2.2 2.2M18.6 18.6l2.2 2.2M20.8 5.2l-2.2 2.2M7.4 18.6l-2.2 2.2"></path></g></svg>
      <div><strong>일조·일조권 사선 검토기</strong><div class="sub">건축법 시행령 제86조 · 정북방향 일조 사선 · 동지 일조시간</div></div>
    </div>
    <div class="hright">
      <div class="hist" role="group" aria-label="되돌리기">
        <button id="undo" title="되돌리기 (Ctrl+Z)" aria-label="되돌리기" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h7.5a4.5 4.5 0 010 9H7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -1.5)"></path></svg></button>
        <button id="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행" disabled><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M11 4l4 4-4 4M15 8H7.5a4.5 4.5 0 000 9H11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -1.5)"></path></svg></button>
      </div>
      <div id="theme-toggle" class="seg" role="group" aria-label="화면 모드"><button data-theme="light">라이트</button><button data-theme="dark">다크</button></div>
      <span class="disclaimer">참고용, 법적 효력 없음</span>
    </div>
  </header>
  <main>
    <aside id="left"></aside>
    <section id="center">
      <nav id="tabs">
        <button data-tab="plan" class="on">평면 편집</button>
        <button data-tab="3d">3D 뷰</button>
      </nav>
      <canvas id="plan"></canvas>
      <div id="view3d" hidden></div>
    </section>
    <aside id="right"></aside>
  </main>
  <script type="module" src="main.js"></script>
</body>
</html>
